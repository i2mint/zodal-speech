# npm auth: trusted publishing (OIDC) only. Never add an NPM_TOKEN secret.
# npmjs.com -> each package -> Settings -> Trusted Publisher -> GitHub Actions:
#   owner/repo = i2mint/zodal-speech, workflow filename = ci.yml, no environment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a PR cancels the older run. Every push to main gets its own group (keyed
# by sha), so a main run is never cancelled by the next push: cancelling one between
# `pnpm publish` and tagging left a version on npm with no tag.
# The publish job below has its own non-cancelling group so releases never overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  gate:
    name: Release gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.subject.outputs.publish }}
      force: ${{ steps.subject.outputs.force }}

    steps:
      - uses: actions/checkout@v6

      # Only the commit SUBJECT (first line) may arm a release. The previous gate matched the
      # whole commit message, so a commit that merely *mentioned* the marker in its body --
      # such as one documenting this very workflow -- published to npm for real.
      #
      # The subject is read with git rather than interpolated from the event payload, so an
      # arbitrary commit message can never be spliced into this shell.
      - id: subject
        run: |
          set -euo pipefail
          subject=$(git log -1 --pretty=%s)
          publish=false
          force=false
          case "$subject" in
            *'[force publish]'*) publish=true; force=true ;;
            *'[publish]'*)       publish=true ;;
          esac
          echo "subject: $subject"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

  publish:
    needs: [validate, gate]
    runs-on: ubuntu-latest
    if: needs.gate.outputs.publish == 'true'
    # Releases never overlap and a running one is never cancelled. Only an armed release joins
    # the shared group: a run whose publish job is skipped gets a group of its own, so it can
    # never take the single pending slot from a release that is waiting its turn.
    concurrency:
      group: ${{ needs.gate.outputs.publish == 'true' && format('npm-publish-{0}', github.repository) || format('no-publish-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Ensure npm >= 11.5.1 (required for OIDC trusted publishing)
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Re-running an older main run (its release cancelled or failed after a newer one shipped)
      # would publish the older version as `latest` and move npm's default install back to it.
      # Anything older than what `latest` points at today goes out under `backport`, and a
      # prerelease under `next`. A package not on the registry yet (first release) has no
      # `latest`. Every step here fails closed: an unknown answer stops the release.
      - name: Choose the npm dist-tag
        id: disttag
        run: |
          set -euo pipefail
          # Prints the dist-tag for version $1 given npm's current latest $2 (may be empty).
          # Semver precedence, prereleases included; a malformed version throws (non-zero exit).
          dist_tag_for() {
            node -e '
              const [version, latest] = process.argv.slice(1);
              const SEMVER = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/;
              const parse = (v) => {
                const m = SEMVER.exec(v);
                if (!m) throw new Error(`not a semver version: "${v}"`);
                return { core: m.slice(1, 4).map(Number), pre: m[4] ? m[4].split(".") : [] };
              };
              const compareIds = (a, b) => {
                const na = /^\d+$/.test(a), nb = /^\d+$/.test(b);
                if (na && nb) return Number(a) - Number(b);
                if (na !== nb) return na ? -1 : 1;
                return a < b ? -1 : a > b ? 1 : 0;
              };
              const compare = (x, y) => {
                for (let i = 0; i < 3; i++) if (x.core[i] !== y.core[i]) return x.core[i] - y.core[i];
                if (!x.pre.length || !y.pre.length) return y.pre.length - x.pre.length;
                for (let i = 0; i < Math.max(x.pre.length, y.pre.length); i++) {
                  if (i >= x.pre.length) return -1;
                  if (i >= y.pre.length) return 1;
                  const c = compareIds(x.pre[i], y.pre[i]);
                  if (c) return c;
                }
                return 0;
              };
              const v = parse(version);
              if (latest && compare(v, parse(latest)) < 0) console.log("backport");
              else console.log(v.pre.length ? "next" : "latest");
            ' "$1" "$2"
          }
          # An assignment, not process substitution, so a failing pnpm or node stops the step.
          pkgs=$(pnpm -r ls --depth -1 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))if(!p.private)console.log(p.name+"\t"+p.version)})')
          [ -n "$pkgs" ] || { echo "::error::no publishable workspace packages found"; exit 1; }
          tags=""
          while IFS=$'\t' read -r name version; do
            # Only a 404 means "not on the registry yet"; any other failure stops the release
            # rather than guess, since guessing `latest` is the bug this step prevents.
            if ! current=$(npm view "$name" dist-tags.latest 2>"$RUNNER_TEMP/npm-view.err"); then
              grep -q E404 "$RUNNER_TEMP/npm-view.err" || { cat "$RUNNER_TEMP/npm-view.err"; exit 1; }
              current=""
            fi
            tag=$(dist_tag_for "$version" "$current")
            echo "${name}@${version} (npm latest: ${current:-none}) -> ${tag}"
            [ "$tag" != backport ] || echo "::warning::${name}@${version} is older than npm's latest (${current}): publishing under the 'backport' dist-tag"
            tags+="${tag}"$'\n'
          done <<<"$pkgs"
          # `pnpm -r publish` takes one --tag for every package, which is right only while the
          # packages release in lockstep; if they disagree, stop rather than mis-tag some.
          distinct=$(printf '%s' "$tags" | sort -u)
          if [ "$(printf '%s\n' "$distinct" | wc -l)" -ne 1 ]; then
            echo "::error::packages need different dist-tags (${distinct//$'\n'/, }); publish them separately"
            exit 1
          fi
          echo "dist-tag: $distinct"
          echo "tag=$distinct" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: pnpm publish --access public --provenance --no-git-checks --tag "$DIST_TAG"

      # Tag the published version. An existing remote tag is fine (a re-run, or a version that
      # was already on npm and tagged by the run that published it); any other push failure
      # (key, permissions, network) fails the run instead of leaving a version with no tag.
      - name: Tag release
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          remote=$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          if [ -n "$remote" ]; then
            # An annotated tag lists its commit on the peeled `^{}` line.
            tagged=$(echo "$remote" | awk '$2 ~ /\^\{\}$/ {print $1}')
            [ -n "$tagged" ] || tagged=$(echo "$remote" | awk '{print $1; exit}')
            if [ "$tagged" = "$(git rev-parse HEAD)" ]; then
              echo "${TAG} already tagged at this commit"
            else
              echo "::warning::${TAG} already exists at ${tagged}, not at this commit: kept as is (that run published ${VERSION})"
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
